<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>F-Mark — launch-planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4efe6;          /* outer chrome */
    --canvas: #faf6ed;      /* feed canvas, slightly warmer */
    --panel: #efe9dc;       /* side panels */
    --panel-2: #e8e1d0;     /* hover */
    --ink: #1a1714;
    --ink-2: #4a443a;
    --ink-3: #807868;
    --ink-4: #a89e88;
    --line: #d9d1bc;
    --line-2: #e6dec9;
    --line-3: #ece5d2;
    --user: #2a5fa8;        /* user blue */
    --user-tint: #e8eef7;
    --user-tint-2: #d4dff1;
    --agent: #b86a1f;       /* agent amber */
    --agent-tint: #f6ead9;
    --agent-tint-2: #ecd9b5;
    --green: #3d7a4f;
    --green-tint: #dbe9de;
    --rose: #a83a3a;
    --shadow: 0 1px 0 rgba(40,30,15,.04), 0 1px 2px rgba(40,30,15,.04);
    --shadow-2: 0 1px 0 rgba(40,30,15,.06), 0 4px 16px rgba(40,30,15,.06);
    --sans: 'DM Sans', system-ui, sans-serif;
    --serif: 'Source Serif 4', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 6px;
    --radius-lg: 10px;
    --radius-pill: 999px;
    --border-w: 1px;
  }

  /* === THEME: terminal === */
  body.theme-terminal{
    --bg:#050605; --canvas:#0a0c0a; --panel:#0d100d; --panel-2:#161a16;
    --ink:#cfe8c5; --ink-2:#8fb585; --ink-3:#5f7a58; --ink-4:#3d5238;
    --line:#1d2a1d; --line-2:#152015; --line-3:#0f180f;
    --user:#4ec0ff; --user-tint:#0a1622; --user-tint-2:#142a40;
    --agent:#ffb13e; --agent-tint:#1d1407; --agent-tint-2:#3a2710;
    --green:#3aff7b; --green-tint:#0a1f12;
    --rose:#ff5577;
    --shadow:none; --shadow-2:0 0 0 1px rgba(58,255,123,.05);
    --serif:'JetBrains Mono', ui-monospace, monospace;
    --sans:'JetBrains Mono', ui-monospace, monospace;
    --radius:2px; --radius-lg:3px;
  }

  /* === THEME: ide-dark === */
  body.theme-ide{
    --bg:#0e1014; --canvas:#14171c; --panel:#1a1d23; --panel-2:#22262e;
    --ink:#e6e8eb; --ink-2:#b4b8c0; --ink-3:#7d828c; --ink-4:#525762;
    --line:#262a32; --line-2:#1f232a; --line-3:#1a1e25;
    --user:#5b9dff; --user-tint:#0f1a2e; --user-tint-2:#1c3358;
    --agent:#ffa657; --agent-tint:#2a1d10; --agent-tint-2:#4a3318;
    --green:#3fb950; --green-tint:#0e2418;
    --rose:#f85149;
    --shadow:0 1px 0 rgba(0,0,0,.3); --shadow-2:0 4px 16px rgba(0,0,0,.3);
    --radius:5px; --radius-lg:8px;
  }

  /* === THEME: solarized === */
  body.theme-solarized{
    --bg:#002b36; --canvas:#073642; --panel:#062a33; --panel-2:#0a3d4a;
    --ink:#fdf6e3; --ink-2:#93a1a1; --ink-3:#657b83; --ink-4:#586e75;
    --line:#0a4150; --line-2:#0a3a48; --line-3:#073642;
    --user:#268bd2; --user-tint:#0a2638; --user-tint-2:#13456a;
    --agent:#cb4b16; --agent-tint:#2a1108; --agent-tint-2:#4a1f10;
    --green:#859900; --green-tint:#1a2008;
    --rose:#dc322f;
    --shadow:0 1px 0 rgba(0,0,0,.3); --shadow-2:0 4px 16px rgba(0,0,0,.4);
    --radius:4px; --radius-lg:6px;
  }

  /* === THEME: brutalist === */
  body.theme-brutalist{
    --bg:#000000; --canvas:#0a0a0a; --panel:#141414; --panel-2:#1f1f1f;
    --ink:#ffffff; --ink-2:#d4d4d4; --ink-3:#888888; --ink-4:#555555;
    --line:#404040; --line-2:#2a2a2a; --line-3:#1a1a1a;
    --user:#ffffff; --user-tint:#1a1a1a; --user-tint-2:#333333;
    --agent:#ffffff; --agent-tint:#1a1a1a; --agent-tint-2:#333333;
    --green:#ffffff; --green-tint:#1a1a1a;
    --rose:#ff0000;
    --shadow:none; --shadow-2:none;
    --serif:'JetBrains Mono', ui-monospace, monospace;
    --sans:'JetBrains Mono', ui-monospace, monospace;
    --radius:0px; --radius-lg:0px; --radius-pill:0px;
    --border-w:2px;
  }

  /* === THEME: cyberpunk === */
  body.theme-cyber{
    --bg:#0a0716; --canvas:#100b22; --panel:#150e2e; --panel-2:#1d143d;
    --ink:#e8e3ff; --ink-2:#a99bd4; --ink-3:#7a6ba8; --ink-4:#544675;
    --line:#2a1f4d; --line-2:#1f1638; --line-3:#170f28;
    --user:#00e5ff; --user-tint:#001e2a; --user-tint-2:#003a52;
    --agent:#ff2bd6; --agent-tint:#2a0824; --agent-tint-2:#4d1342;
    --green:#7dff5a; --green-tint:#0e2008;
    --rose:#ff3370;
    --shadow:0 1px 0 rgba(0,0,0,.4); --shadow-2:0 0 24px rgba(255,43,214,.12), 0 4px 14px rgba(0,0,0,.4);
    --radius:3px; --radius-lg:5px;
  }
  /* === THEME structural overrides === */
  body.theme-brutalist *, body.theme-brutalist *::before, body.theme-brutalist *::after { transition:none !important; }
  body.theme-brutalist .card, body.theme-brutalist .prose-card, body.theme-brutalist .embed-card, body.theme-brutalist .choices-card, body.theme-brutalist .todo-card, body.theme-brutalist .file-card{
    border-width:2px; border-color:var(--line); box-shadow:none; border-radius:0;
  }
  body.theme-brutalist .modal, body.theme-brutalist .popover{ border-width:2px; box-shadow:none; border-radius:0 }
  body.theme-brutalist .turn-pill, body.theme-brutalist .badge, body.theme-brutalist .pop-chip,
  body.theme-brutalist .assign-badge, body.theme-brutalist .kbd-chip, body.theme-brutalist .prose-pin,
  body.theme-brutalist .status-pill, body.theme-brutalist .cmdk-kind{ border-radius:0 !important; border-width:1.5px }
  body.theme-brutalist .avatar{ border-radius:0; border:1.5px solid var(--ink); background:#000; color:#fff }
  body.theme-brutalist .avatar.user, body.theme-brutalist .avatar.agent{ background:#000 }
  body.theme-brutalist .card .stripe{ width:5px; background:var(--ink) }
  body.theme-brutalist .feed-inner h1, body.theme-brutalist .feed-inner h2, body.theme-brutalist .feed-inner h3{ text-transform:uppercase; letter-spacing:.02em }
  body.theme-brutalist .prose-pin{ background:var(--ink); color:var(--canvas); border-color:var(--ink) }
  body.theme-brutalist .prose-pin .dot{ background:var(--canvas) }
  body.theme-brutalist .rail-btn.active::before, body.theme-brutalist .session-item.active::before{ background:var(--ink); width:5px }
  body.theme-brutalist .form-input:focus, body.theme-brutalist .compose-box:focus-within{ box-shadow:0 0 0 2px var(--ink) !important; border-color:var(--ink) !important }

  body.theme-terminal{ font-feature-settings: "tnum" }
  body.theme-terminal::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:200;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(58,255,123,.025) 2px, rgba(58,255,123,.025) 3px);
  }
  body.theme-terminal .prose-card, body.theme-terminal .embed-card, body.theme-terminal .choices-card, body.theme-terminal .todo-card, body.theme-terminal .file-card{ box-shadow:0 0 0 1px rgba(58,255,123,.05) }
  body.theme-terminal .prose-head, body.theme-terminal .choices-head, body.theme-terminal .embed-head{ border-style:dashed }
  body.theme-terminal .prose-foot, body.theme-terminal .embed-foot{ border-style:dashed }
  body.theme-terminal .turn-pill .dot{ box-shadow:0 0 8px var(--green) }
  body.theme-terminal .prose-pin{ box-shadow:0 0 8px rgba(78,192,255,.4) }
  body.theme-terminal .prose-title, body.theme-terminal .choices-q, body.theme-terminal .embed-title, body.theme-terminal .modal-title, body.theme-terminal .settings-h{ text-transform:uppercase; letter-spacing:.02em }
  body.theme-terminal .feed-inner h2{ text-transform:uppercase; letter-spacing:.05em; color:var(--ink) }
  body.theme-terminal .feed-inner h2::before{ content:"## "; color:var(--ink-3) }

  body.theme-cyber .turn-pill, body.theme-cyber .prose-pin{ box-shadow:0 0 16px rgba(0,229,255,.25) }
  body.theme-cyber .card.user .stripe{ box-shadow:0 0 12px var(--user) }
  body.theme-cyber .card.agent .stripe{ box-shadow:0 0 12px var(--agent) }
  body.theme-cyber .prose-card{ box-shadow:0 0 24px rgba(255,43,214,.06), 0 4px 14px rgba(0,0,0,.4) }
  body.theme-cyber .send-btn{ background:linear-gradient(135deg, var(--user), var(--agent)); color:#000; font-weight:600 }
  body.theme-cyber .btn-solid{ background:linear-gradient(135deg, var(--user), var(--agent)); color:#000 }
  body.theme-cyber .choice-opt.chosen{ box-shadow:0 0 16px rgba(125,255,90,.2) }
  body.theme-cyber .rail-btn.active::before{ background:linear-gradient(180deg, var(--user), var(--agent)) }
  body.theme-cyber .topbar, body.theme-cyber .left-panel, body.theme-cyber .right-panel{ border-color:var(--line) }
  body.theme-cyber .prose-title{ background:linear-gradient(90deg, var(--ink), var(--user) 80%); -webkit-background-clip:text; background-clip:text; color:transparent }

  /* All dark themes — kill the linear gradient on prose-head that uses rgba(0,0,0,.012) */
  body.theme-terminal .prose-head, body.theme-ide .prose-head, body.theme-solarized .prose-head, body.theme-brutalist .prose-head, body.theme-cyber .prose-head,
  body.theme-terminal .prose-foot, body.theme-ide .prose-foot, body.theme-solarized .prose-foot, body.theme-brutalist .prose-foot, body.theme-cyber .prose-foot,
  body.theme-terminal .embed-foot, body.theme-ide .embed-foot, body.theme-solarized .embed-foot, body.theme-brutalist .embed-foot, body.theme-cyber .embed-foot,
  body.theme-terminal .modal-foot, body.theme-ide .modal-foot, body.theme-solarized .modal-foot, body.theme-brutalist .modal-foot, body.theme-cyber .modal-foot,
  body.theme-terminal .pop-foot, body.theme-ide .pop-foot, body.theme-solarized .pop-foot, body.theme-brutalist .pop-foot, body.theme-cyber .pop-foot,
  body.theme-terminal .cmdk-foot, body.theme-ide .cmdk-foot, body.theme-solarized .cmdk-foot, body.theme-brutalist .cmdk-foot, body.theme-cyber .cmdk-foot{
    background:rgba(255,255,255,.02) !important;
  }
  /* Choice opt hover in dark themes */
  body.theme-terminal .choice-opt:hover, body.theme-ide .choice-opt:hover, body.theme-solarized .choice-opt:hover, body.theme-brutalist .choice-opt:hover, body.theme-cyber .choice-opt:hover{
    background:rgba(255,255,255,.02);
  }
  /* feed-scroll dim mode in dark themes */
  body.theme-terminal .feed-scroll.dimmed .card:not(.focused),
  body.theme-ide .feed-scroll.dimmed .card:not(.focused),
  body.theme-solarized .feed-scroll.dimmed .card:not(.focused),
  body.theme-brutalist .feed-scroll.dimmed .card:not(.focused),
  body.theme-cyber .feed-scroll.dimmed .card:not(.focused){ opacity:.35 }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  html{overflow-x:auto;overflow-y:hidden}
  body{height:100vh;overflow:hidden;min-width:1360px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  ::selection{background:rgba(42,95,168,.18)}
  /* Scrollbars (soft) */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink-4);background-clip:padding-box;border:2px solid transparent}
  ::-webkit-scrollbar-track{background:transparent}

  /* App skeleton */
  .app{display:grid;grid-template-rows:52px 1fr auto;height:100vh}
  .main{display:grid;grid-template-columns:auto auto 1fr auto;min-height:0}
  .feed-col{min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .feed-scroll{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth}
  .feed-inner{max-width:780px;margin:0 auto;padding:36px 28px 80px;display:flex;flex-direction:column;gap:18px}

  /* Top bar */
  .topbar{display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg);height:52px;position:relative;z-index:30}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px}
  .brand .glyph{font-family:var(--mono);font-size:9px;line-height:8px;white-space:pre;color:var(--ink);letter-spacing:-.5px}
  .brand .name{font-family:var(--mono);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
  .breadcrumb{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--ink-2);padding:6px 10px;border-radius:6px;white-space:nowrap}
  .breadcrumb:hover{background:var(--panel)}
  .breadcrumb .sep{color:var(--ink-4)}
  .breadcrumb .proj{color:var(--ink-3)}
  .breadcrumb .sess{color:var(--ink);font-weight:600}
  .breadcrumb .caret{color:var(--ink-3);margin-left:2px}

  .topbar-center{flex:1;display:flex;align-items:center;justify-content:center;gap:14px}
  .turn-pill{display:flex;align-items:center;gap:8px;padding:5px 11px 5px 9px;border-radius:999px;background:var(--green-tint);color:var(--green);font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.02em;border:1px solid var(--line);white-space:nowrap}
  .turn-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(61,122,79,.18)}
  .turn-pill.thinking{background:var(--agent-tint);color:var(--agent);border-color:var(--agent-tint-2)}
  .turn-pill.thinking .dot{background:var(--agent);animation:pulse 1.6s infinite ease-in-out;box-shadow:0 0 0 3px rgba(184,106,31,.18)}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

  .participants{display:flex;align-items:center;gap:-4px}
  .avatar{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;font-family:var(--mono);border:1.5px solid var(--bg);margin-left:-4px;position:relative}
  .avatar:first-child{margin-left:0}
  .avatar.user{background:var(--user)}
  .avatar.agent{background:var(--agent)}
  .avatar.sm{width:18px;height:18px;font-size:9.5px;border-width:1.5px}
  .avatar.lg{width:26px;height:26px;font-size:12px}
  .avatar.xl{width:30px;height:30px;font-size:13px}
  .avatar.active::after{content:"";position:absolute;bottom:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:var(--green);border:1.5px solid var(--bg)}

  .topbar-right{display:flex;align-items:center;gap:4px}
  .view-toggle{display:flex;align-items:center;background:var(--panel);border-radius:7px;padding:3px;gap:1px}
  .view-toggle button{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);padding:5px 9px;border-radius:5px;font-family:var(--mono);letter-spacing:-.01em;white-space:nowrap}
  .view-toggle button.active{background:var(--canvas);color:var(--ink);box-shadow:var(--shadow)}
  .view-toggle button:hover:not(.active){color:var(--ink)}
  .icon-btn{width:32px;height:32px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);position:relative}
  .icon-btn:hover{background:var(--panel);color:var(--ink)}
  .icon-btn .kbd{position:absolute;bottom:2px;right:2px;font-family:var(--mono);font-size:8px;color:var(--ink-4)}

  /* LEFT panel */
  .left-rail{display:flex;flex-direction:column;width:48px;background:var(--bg);border-right:1px solid var(--line);align-items:center;padding:10px 0 12px;gap:2px}
  .right-rail{display:flex;flex-direction:column;width:48px;background:var(--bg);border-left:1px solid var(--line);align-items:center;padding:10px 0;gap:2px}
  .rail-btn{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);position:relative;background:none;border:0;cursor:pointer;padding:0}
  .rail-btn:hover{background:var(--panel);color:var(--ink)}
  .rail-btn.active{background:var(--panel);color:var(--ink)}
  .left-rail .rail-btn.active::before{content:"";position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--ink);border-radius:0 2px 2px 0}
  .right-rail .rail-btn.active::before{content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--ink);border-radius:2px 0 0 2px}
  .rail-btn .badge{position:absolute;top:2px;right:2px;font-family:var(--mono);font-size:9px;background:var(--user);color:#fff;border-radius:6px;padding:1px 4px;line-height:1}

  .left-panel{width:288px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
  .panel-head h3{margin:0;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .new-btn{font-size:11.5px;color:var(--ink);background:var(--bg);padding:4px 9px;border-radius:5px;font-family:var(--mono);border:1px solid var(--line);white-space:nowrap}
  .panel-head .new-btn:hover{background:var(--canvas)}
  .panel-head .scope{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);letter-spacing:.04em;padding-top:2px}
  .panel-head .scope b{color:var(--ink-2);font-weight:500}
  .panel-search{margin:0 12px 8px;display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .panel-search input{flex:1;background:transparent;border:0;outline:0;font:inherit;color:var(--ink)}
  .panel-list{flex:1;overflow:auto;padding:4px 8px 12px}
  .group-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);padding:14px 8px 6px}
  .session-item{padding:8px 10px;border-radius:6px;cursor:pointer;position:relative;margin-bottom:1px}
  .session-item:hover{background:var(--panel-2)}
  .session-item.active{background:var(--bg)}
  .session-item.active::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--ink)}
  .session-item .row1{display:flex;align-items:center;gap:7px}
  .session-item .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .session-item .status-dot.active{background:var(--green)}
  .session-item .status-dot.idle{background:transparent;border:1.5px solid var(--ink-4)}
  .session-item .slug{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .session-item .summary{font-size:12px;color:var(--ink-3);margin:2px 0 3px;padding-left:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .session-item .meta{padding-left:14px;display:flex;gap:9px;font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
  .session-item .meta .sep{color:var(--line)}

  /* Right panel */
  .right-panel{width:340px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .right-panel .panel-head h3{color:var(--ink);text-transform:none;letter-spacing:.01em;font-family:var(--serif);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .right-panel .panel-head .subhead{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
  .right-tabs{display:flex;gap:0;padding:0 12px;border-bottom:1px solid var(--line-2)}
  .right-tabs button{padding:8px 10px;font-size:12px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:5px;font-family:var(--mono);letter-spacing:-.01em}
  .right-tabs button.active{color:var(--ink);border-bottom-color:var(--ink)}
  .right-tabs button:hover:not(.active){color:var(--ink)}
  .right-tabs .ct{background:var(--line-2);font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;color:var(--ink-2)}

  /* Compose bar */
  .compose{border-top:1px solid var(--line);background:var(--bg);padding:12px 14px 14px}
  .compose-inner{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .compose-target{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--user-tint);border:1px dashed var(--user-tint-2);border-radius:6px;font-size:12px;color:var(--user);font-family:var(--mono)}
  .compose-target .close{margin-left:auto;color:var(--ink-3);width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px}
  .compose-target .close:hover{background:rgba(0,0,0,.05);color:var(--ink)}
  .compose-name{display:flex;align-items:center;gap:8px;padding:0 0 0 2px}
  .compose-name label{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
  .compose-name input{flex:1;background:transparent;border:0;outline:0;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink)}
  .compose-name input::placeholder{color:var(--ink-4);font-weight:400;font-style:italic}
  .compose-box{background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);transition:border-color .15s, box-shadow .15s}
  .compose-box:focus-within{border-color:var(--ink-4);box-shadow:0 0 0 3px rgba(40,30,15,.04), var(--shadow)}
  .compose-box textarea{width:100%;background:transparent;border:0;outline:0;resize:none;font:inherit;font-size:14px;color:var(--ink);min-height:24px;max-height:140px;line-height:1.55}
  .compose-box textarea::placeholder{color:var(--ink-4)}
  .compose-actions{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-2)}
  .mode-btn{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:5px;font-size:11.5px;color:var(--ink-2);font-family:var(--mono);white-space:nowrap}
  .mode-btn:hover{background:var(--panel)}
  .mode-btn.active{background:var(--ink);color:var(--canvas)}
  .mode-btn .kbd{font-size:9.5px;color:var(--ink-4);margin-left:2px}
  .mode-btn.active .kbd{color:rgba(255,255,255,.5)}
  .send-btn{margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:6px;background:var(--ink);color:var(--canvas);font-size:13px;font-weight:500;font-family:var(--sans);white-space:nowrap}
  .send-btn.outline{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
  .send-btn:hover{filter:brightness(.96)}
  .send-btn .kbd{font-family:var(--mono);font-size:10px;opacity:.6}

  /* keyboard chip */
  .kbd-chip{display:inline-flex;align-items:center;gap:1px;font-family:var(--mono);font-size:10px;color:var(--ink-3);background:var(--bg);border:1px solid var(--line);padding:1px 4px;border-radius:3px;line-height:1.2}

  /* CARDS */
  .card{position:relative;display:flex;gap:0;align-items:stretch}
  .card .stripe{width:3px;border-radius:2px;flex-shrink:0;background:var(--ink-4)}
  .card.user .stripe{background:var(--user)}
  .card.agent .stripe{background:var(--agent)}
  .card .body{flex:1;min-width:0;padding-left:14px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px;flex-wrap:nowrap}
  .card-head .who{font-weight:600;color:var(--ink)}
  .card-head .when{color:var(--ink-4);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
  .card-head .badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);background:var(--canvas);border:1px solid var(--line-2);padding:2px 7px;border-radius:999px;display:flex;align-items:center;gap:4px}
  .card-head .menu{color:var(--ink-4);width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center}
  .card-head .menu:hover{background:var(--panel);color:var(--ink)}

  /* Message card (light) */
  .msg-card .body{padding:2px 0 0 14px}
  .msg-card .text{font-size:14.5px;color:var(--ink);line-height:1.55}
  .msg-card .text strong{font-weight:600}
  .msg-card .actions{margin-top:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
  .msg-card:hover .actions{opacity:1}
  .msg-card .actions button{font-size:11.5px;color:var(--ink-3);padding:3px 8px;border-radius:4px;font-family:var(--mono)}
  .msg-card .actions button:hover{background:var(--panel);color:var(--ink)}

  /* Named prose card (substantial) */
  .prose-card{display:block;border:1px solid var(--line-2);border-radius:10px;background:var(--canvas);box-shadow:var(--shadow);overflow:hidden}
  .prose-head{padding:12px 18px;border-bottom:1px solid var(--line-3);display:flex;align-items:center;gap:8px;font-size:12px;background:linear-gradient(to bottom, rgba(0,0,0,.012), transparent);flex-wrap:nowrap;white-space:nowrap}
  .prose-head .stripe-dot{width:8px;height:8px;border-radius:50%;background:var(--agent)}
  .prose-card.user .prose-head .stripe-dot{background:var(--user)}
  .prose-head .who{font-weight:600}
  .prose-head .when{color:var(--ink-4);font-family:var(--mono);font-size:11px}
  .prose-head .badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--agent);background:var(--agent-tint);padding:2px 8px;border-radius:999px;letter-spacing:.05em}
  .prose-body{padding:22px 64px 22px 30px;position:relative}
  .prose-body.user{padding-left:30px}
  .prose-title{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--ink);margin:0 0 4px;letter-spacing:-.015em;line-height:1.15}
  .prose-frontmatter{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);margin:0 0 18px;display:flex;gap:14px;flex-wrap:wrap}
  .prose-frontmatter span{display:flex;gap:4px;white-space:nowrap}
  .prose-frontmatter b{color:var(--ink-3);font-weight:500}
  .prose-content{font-family:var(--serif);font-size:15.5px;line-height:1.6;color:var(--ink)}
  .prose-content h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:24px 0 8px;color:var(--ink);letter-spacing:-.01em}
  .prose-content h2:first-child{margin-top:0}
  .prose-content h3{font-family:var(--serif);font-size:15.5px;font-weight:600;margin:18px 0 6px;color:var(--ink)}
  .prose-content p{margin:0 0 12px}
  .prose-content ul, .prose-content ol{margin:0 0 12px;padding-left:22px}
  .prose-content li{margin:2px 0}
  .prose-content code{font-family:var(--mono);font-size:13px;background:var(--panel);padding:1px 5px;border-radius:3px;color:var(--ink)}
  .prose-content blockquote{margin:12px 0;padding:4px 16px;border-left:3px solid var(--agent-tint-2);color:var(--ink-2);font-style:italic}
  .prose-content .num{font-family:var(--mono);font-style:normal;color:var(--agent);font-weight:600}
  .prose-line{position:relative}
  .prose-line.has-comment::before{content:"";position:absolute;left:-18px;top:.2em;bottom:.2em;width:3px;background:var(--user);opacity:.25;border-radius:2px}

  .prose-pin{position:absolute;right:18px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;background:var(--canvas);border:1px solid var(--user-tint-2);color:var(--user);border-radius:999px;font-family:var(--mono);font-size:10.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s, background .15s}
  .prose-pin:hover{background:var(--user-tint);transform:translateX(-2px)}
  .prose-pin .dot{width:6px;height:6px;border-radius:50%;background:var(--user)}
  .prose-pin.resolved{color:var(--ink-3);border-color:var(--line)}
  .prose-pin.resolved .dot{background:var(--ink-4)}
  .prose-pin.active{background:var(--user);color:#fff;border-color:var(--user)}
  .prose-pin.active .dot{background:#fff}

  .prose-foot{display:flex;align-items:center;gap:2px;padding:8px 18px 10px;border-top:1px solid var(--line-3);background:rgba(0,0,0,.012)}
  .prose-foot button{font-size:11.5px;color:var(--ink-3);padding:5px 10px;border-radius:5px;font-family:var(--mono);display:flex;align-items:center;gap:5px}
  .prose-foot button:hover{background:var(--panel);color:var(--ink)}
  .prose-foot .spacer{flex:1}
  .prose-foot .ver{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}

  /* Choices card */
  .choices-card{border:1px solid var(--line-2);border-radius:10px;background:var(--canvas);overflow:hidden;box-shadow:var(--shadow)}
  .choices-head{padding:12px 16px;border-bottom:1px solid var(--line-3);display:flex;align-items:center;gap:8px;font-size:12px}
  .choices-head .badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--agent);background:var(--agent-tint);padding:2px 8px;border-radius:999px}
  .choices-body{padding:18px 22px 16px}
  .choices-q{font-family:var(--serif);font-size:18.5px;font-weight:600;color:var(--ink);margin:0 0 14px;letter-spacing:-.01em}
  .choice-opt{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line-2);border-radius:8px;cursor:pointer;margin-bottom:8px;transition:background .15s, border-color .15s}
  .choice-opt:hover{border-color:var(--ink-4);background:rgba(0,0,0,.012)}
  .choice-opt.chosen{background:var(--green-tint);border-color:var(--green)}
  .choice-opt.faded{opacity:.45}
  .choice-radio{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-4);display:inline-flex;align-items:center;justify-content:center;margin-top:2px;transition:.15s}
  .choice-opt.chosen .choice-radio{border-color:var(--green);background:var(--green)}
  .choice-opt.chosen .choice-radio::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--canvas)}
  .choice-opt .lbl{font-weight:600;color:var(--ink);font-size:14px;display:flex;align-items:center;gap:8px}
  .choice-opt .lbl .check{color:var(--green);font-family:var(--mono);font-size:10.5px;background:var(--canvas);padding:1px 6px;border-radius:999px;border:1px solid var(--green)}
  .choice-opt .desc{font-size:13px;color:var(--ink-2);margin-top:2px;font-family:var(--serif);line-height:1.5}
  .choices-foot{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--ink-4);padding-top:4px}
  .choices-foot .change{color:var(--user);cursor:pointer;text-decoration:underline;text-decoration-color:var(--user-tint-2);text-underline-offset:2px}

  /* Embed card */
  .embed-card{border:1px solid var(--line-2);border-radius:10px;background:var(--canvas);overflow:hidden;box-shadow:var(--shadow)}
  .embed-head{padding:12px 16px;border-bottom:1px solid var(--line-3);display:flex;align-items:center;gap:8px;font-size:12px}
  .embed-head .badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--agent);background:var(--agent-tint);padding:2px 8px;border-radius:999px}
  .embed-title{padding:14px 18px 6px;font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .embed-frame{margin:8px 18px 12px;border:1px solid var(--line-2);border-radius:6px;background:#fff;overflow:hidden;height:300px;position:relative}
  .embed-frame .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:
    repeating-linear-gradient(45deg, #fff, #fff 10px, #fafafa 10px, #fafafa 20px)}
  .embed-frame .placeholder .label{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;margin-top:8px}

  .embed-foot{display:flex;align-items:center;gap:2px;padding:6px 14px 10px;border-top:1px solid var(--line-3);background:rgba(0,0,0,.012)}
  .embed-foot button{font-size:11.5px;color:var(--ink-3);padding:5px 10px;border-radius:5px;font-family:var(--mono);display:flex;align-items:center;gap:5px}
  .embed-foot button:hover{background:var(--panel);color:var(--ink)}
  .embed-foot .spacer{flex:1}
  .variants{display:flex;gap:4px;padding:0 18px 12px;align-items:center}
  .variant{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:5px;border:1px solid var(--line);color:var(--ink-3);cursor:pointer}
  .variant.active{background:var(--ink);color:var(--canvas);border-color:var(--ink)}

  /* Todo card */
  .todo-card{border:1px solid var(--line-2);border-radius:8px;background:var(--canvas);padding:0;box-shadow:var(--shadow)}
  .todo-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px dashed var(--line-3);font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
  .todo-head .who{color:var(--ink)}
  .todo-body{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
  .todo-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink-4);flex-shrink:0;margin-top:2px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .todo-check:hover{border-color:var(--ink)}
  .todo-check.done{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
  .todo-info{flex:1}
  .todo-title{font-size:14px;font-weight:500;color:var(--ink)}
  .todo-card.done .todo-title{text-decoration:line-through;color:var(--ink-4)}
  .todo-desc{font-size:13px;color:var(--ink-3);margin-top:3px;font-family:var(--serif);font-style:italic}
  .todo-meta{display:flex;align-items:center;gap:8px;margin-top:8px}
  .assign-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--ink-2);background:var(--panel);padding:2px 8px 2px 4px;border-radius:999px}
  .assign-badge.unassigned{color:var(--ink-4);padding-left:8px}

  /* Turn-end divider */
  .turn-end{display:flex;align-items:center;gap:10px;margin:6px 0;font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
  .turn-end .line{flex:1;height:1px;background:linear-gradient(to right, transparent, var(--line) 20%, var(--line) 80%, transparent)}
  .turn-end.user .line{background:linear-gradient(to right, transparent, var(--user-tint-2) 20%, var(--user-tint-2) 80%, transparent)}
  .turn-end.agent .line{background:linear-gradient(to right, transparent, var(--agent-tint-2) 20%, var(--agent-tint-2) 80%, transparent)}
  .turn-end .glyph{font-family:var(--mono);font-size:10px;color:var(--ink-4);padding:0 4px}
  .turn-end .label{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);white-space:nowrap}
  .turn-end .label .dot{width:5px;height:5px;border-radius:50%;background:var(--ink-4)}
  .turn-end.user .label .dot{background:var(--user)}
  .turn-end.agent .label .dot{background:var(--agent)}

  /* File card */
  .file-card{display:flex;gap:14px;padding:12px;border:1px solid var(--line-2);border-radius:8px;background:var(--canvas);box-shadow:var(--shadow)}
  .file-thumb{width:96px;height:72px;border-radius:5px;background:
    repeating-linear-gradient(45deg, #f8f4ea, #f8f4ea 8px, #f1ebd9 8px, #f1ebd9 16px);
    border:1px solid var(--line-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
  .file-info{flex:1;display:flex;flex-direction:column;justify-content:center}
  .file-name{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink)}
  .file-meta{font-family:var(--mono);font-size:11px;color:var(--ink-4);margin-top:2px}
  .file-desc{font-size:13px;color:var(--ink-2);font-family:var(--serif);font-style:italic;margin-top:6px}
  .file-actions{display:flex;flex-direction:column;gap:4px;justify-content:center}
  .file-actions button{font-size:11px;color:var(--ink-3);padding:4px 10px;border-radius:4px;font-family:var(--mono);border:1px solid var(--line)}
  .file-actions button:hover{background:var(--panel);color:var(--ink);border-color:var(--ink-4)}

  /* Right panel — comments overlay */
  .panel-scroll{flex:1;overflow:auto;padding:14px 14px 24px}
  .comments-on{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.08em;margin:0 0 4px}
  .comments-on b{color:var(--ink);text-transform:none;font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:0}
  .anchor-snippet{margin:0 0 12px;padding:8px 10px;background:var(--bg);border-left:2px solid var(--user);font-size:12.5px;font-family:var(--serif);color:var(--ink-2);font-style:italic;border-radius:0 4px 4px 0}
  .anchor-snippet .ln{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px}

  .thread{margin-bottom:18px;padding:0 0 12px;border-bottom:1px solid var(--line-2)}
  .thread:last-child{border-bottom:0}
  .thread.resolved{opacity:.55}
  .thread-msg{display:flex;gap:8px;margin-bottom:8px}
  .thread-msg .avatar{margin-top:1px;flex-shrink:0}
  .thread-msg .body{flex:1;min-width:0}
  .thread-msg .head{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:2px;white-space:nowrap}
  .thread-msg .head .who{font-weight:600;color:var(--ink)}
  .thread-msg .head .when{color:var(--ink-4);font-family:var(--mono);font-size:11px;white-space:nowrap}
  .thread-msg .txt{font-size:13px;color:var(--ink);line-height:1.5}
  .thread-msg.reply{padding-left:18px;position:relative}
  .thread-msg.reply::before{content:"";position:absolute;left:8px;top:4px;bottom:8px;width:1px;background:var(--line)}
  .thread-actions{display:flex;align-items:center;gap:6px;margin-top:8px;padding-left:0}
  .reply-input{flex:1;padding:6px 10px;background:var(--bg);border:1px solid var(--line);border-radius:5px;font-size:12.5px;color:var(--ink-3);font-family:var(--sans);cursor:text}
  .resolve-btn{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:5px 10px;border-radius:5px;border:1px solid var(--line)}
  .resolve-btn:hover{background:var(--bg);color:var(--ink)}
  .resolve-btn.resolved{background:var(--green-tint);color:var(--green);border-color:var(--green)}

  /* Right panel — todos list */
  .todo-list{display:flex;flex-direction:column;gap:0}
  .todo-list .group-label{padding:14px 0 6px}
  .todo-list-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2);align-items:flex-start;cursor:pointer}
  .todo-list-item:hover{background:rgba(0,0,0,.015)}
  .todo-list-item .todo-check{margin-top:0}
  .todo-list-item .ttl{font-size:13px;color:var(--ink)}
  .todo-list-item.done .ttl{text-decoration:line-through;color:var(--ink-4)}
  .todo-list-item .meta-row{display:flex;align-items:center;gap:6px;margin-top:4px;font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}

  /* Scroll-to-bottom button */
  .scroll-fab{position:absolute;bottom:18px;right:18px;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--ink);color:var(--canvas);font-size:12px;font-family:var(--mono);box-shadow:var(--shadow-2);z-index:20;cursor:pointer;animation:fadeUp .25s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* dim feed when comment overlay active */
  .feed-scroll.dimmed .card:not(.focused){opacity:.45;transition:opacity .25s}
  .feed-scroll.dimmed .turn-end{opacity:.4}
  .prose-card.focused{box-shadow:0 0 0 2px var(--user-tint-2), var(--shadow-2)}

  /* misc small icons via unicode */
  .ico{display:inline-flex;align-items:center;justify-content:center}

  /* ============ Modals + popovers ============ */
  .modal-backdrop{position:fixed;inset:0;background:rgba(28,22,12,.32);z-index:100;display:flex;align-items:center;justify-content:center}
  .modal{background:var(--canvas);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(40,30,15,.18),0 4px 14px rgba(40,30,15,.08);max-height:88vh;overflow:hidden;display:flex;flex-direction:column}
  .modal.top{align-self:flex-start;margin-top:80px}

  .modal-head{padding:18px 22px 12px;border-bottom:1px solid var(--line-3);position:relative}
  .modal-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-4);text-transform:uppercase;margin-bottom:3px}
  .modal-title{font-family:var(--serif);font-size:22px;font-weight:600;margin:0;color:var(--ink);letter-spacing:-.01em}
  .modal-close{position:absolute;right:12px;top:12px}
  .modal-body{padding:16px 22px;overflow:auto}
  .modal-foot{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line-3);background:rgba(0,0,0,.012)}
  .modal-foot .hint{flex:1;font-family:var(--mono);font-size:11px;color:var(--ink-4);line-height:1.5}

  /* form controls */
  .form-row{margin-bottom:12px}
  .form-row-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .form-label{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;min-width:60px}
  .form-input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font:inherit;font-size:14px;color:var(--ink);outline:0;width:100%}
  .form-input:focus{border-color:var(--ink-4);box-shadow:0 0 0 3px rgba(40,30,15,.04)}
  .form-title{font-family:var(--serif);font-size:18px;font-weight:600;padding:10px 12px}
  .form-textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;font-size:13.5px;color:var(--ink);outline:0;width:100%;resize:vertical;font-family:var(--serif);line-height:1.5}
  .assign-picker{display:flex;gap:6px;flex-wrap:wrap}
  .assign-picker .pick{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--ink-2);font-family:var(--sans);white-space:nowrap;cursor:pointer}
  .assign-picker .pick.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
  .assign-picker .pick:hover:not(.on){border-color:var(--ink-4)}

  .btn-solid{background:var(--ink);color:var(--canvas);padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;font-family:var(--sans)}
  .btn-solid:hover{filter:brightness(.96)}
  .btn-ghost{background:transparent;color:var(--ink-2);padding:7px 14px;border-radius:6px;font-size:13px;border:1px solid var(--line);font-family:var(--sans)}
  .btn-ghost:hover{background:var(--bg);color:var(--ink)}

  /* popover (filter dropdown, presets) */
  .popover-backdrop{position:fixed;inset:0;z-index:90}
  .popover{position:fixed;background:var(--canvas);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(40,30,15,.18),0 2px 8px rgba(40,30,15,.06);overflow:hidden;display:flex;flex-direction:column}
  .pop-head{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line-3);font-family:var(--serif);font-size:14.5px;font-weight:600;color:var(--ink)}
  .pop-section{padding:12px 14px;border-bottom:1px solid var(--line-3)}
  .pop-section-h{display:flex;align-items:center}
  .pop-section:last-of-type{border-bottom:0}
  .pop-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);margin-bottom:8px}
  .pop-chips{display:flex;gap:5px;flex-wrap:wrap}
  .pop-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:11px;color:var(--ink-3);cursor:pointer}
  .pop-chip.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
  .pop-chip:not(.on):hover{border-color:var(--ink-4);color:var(--ink-2)}
  .pop-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--ink-2)}
  .pop-toggle input{accent-color:var(--ink)}
  .pop-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line-3);background:rgba(0,0,0,.012)}
  .seg-control{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px;gap:1px}
  .seg-control button{padding:5px 11px;border-radius:5px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);background:none;border:0;cursor:pointer}
  .seg-control button.on{background:var(--canvas);color:var(--ink);box-shadow:var(--shadow)}

  /* Settings modal */
  .settings{display:grid;grid-template-columns:200px 1fr;min-height:520px;position:relative}
  .settings-side{background:var(--panel);border-right:1px solid var(--line-2);padding:14px 8px;display:flex;flex-direction:column;gap:2px}
  .settings-side-head{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);padding:0 10px 8px}
  .settings-side-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;background:none;border:0;cursor:pointer;color:var(--ink-2);font-size:13px;text-align:left;font-family:var(--sans)}
  .settings-side-item:hover{background:var(--panel-2)}
  .settings-side-item.active{background:var(--canvas);color:var(--ink);box-shadow:var(--shadow)}
  .settings-main{padding:28px 32px;overflow:auto;position:relative}
  .settings-h{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 4px;color:var(--ink);letter-spacing:-.01em}
  .settings-sub{color:var(--ink-3);font-family:var(--serif);font-size:13.5px;margin-bottom:18px;font-style:italic}
  .settings-row{display:grid;grid-template-columns:160px 1fr;gap:18px;padding:12px 0;border-bottom:1px solid var(--line-2);align-items:center}
  .settings-row:last-child{border-bottom:0}
  .settings-l{font-size:13px;color:var(--ink-2);font-weight:500}
  .codish{font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--bg);padding:2px 7px;border-radius:4px;border:1px solid var(--line)}
  .color-row{display:flex;gap:8px}
  .swatch{width:24px;height:24px;border-radius:6px;cursor:pointer}
  .agent-list{margin:14px 0;display:flex;flex-direction:column;gap:8px}
  .agent-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg)}
  .agent-add{padding:10px 14px;border:1px dashed var(--line);border-radius:8px;background:transparent;font-family:var(--mono);font-size:12.5px;color:var(--ink-3);text-align:left}
  .agent-add:hover{border-color:var(--ink-4);color:var(--ink)}
  .status-pill{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0}
  .status-pill.on{background:var(--green-tint);color:var(--green);border:1px solid var(--green)}
  .status-pill.off{background:var(--bg);color:var(--ink-4);border:1px solid var(--line)}
  .snippet-box{margin-top:18px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);position:relative;overflow:hidden}
  .snippet-head{padding:8px 14px;border-bottom:1px solid var(--line-2);font-family:var(--mono);font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
  .snippet-body{padding:14px;margin:0;font-family:var(--mono);font-size:12.5px;color:var(--ink);line-height:1.55;background:#1a1714;color:#e6dec9;white-space:pre-wrap}
  .copy-btn{position:absolute;top:38px;right:12px;font-family:var(--mono);font-size:10.5px;color:#e6dec9;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:3px 9px;border-radius:4px;cursor:pointer}
  .copy-btn:hover{background:rgba(255,255,255,.14)}
  .kbd-grid{display:flex;flex-direction:column;gap:0}
  .kbd-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2);gap:14px}
  .kbd-row > span:first-child{flex:1}
  .kbd-row:last-child{border-bottom:0}
  .kbd-keys{margin-left:auto;display:flex;gap:4px}
  kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;font-family:var(--mono);font-size:11.5px;color:var(--ink);font-weight:500}
  .about-block pre{user-select:none}

  /* Command palette */
  .cmdk{display:flex;flex-direction:column;height:520px;max-height:88vh}
  .cmdk-input-row{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
  .cmdk-input{flex:1;background:transparent;border:0;outline:0;font:inherit;font-size:15px;color:var(--ink);font-family:var(--sans)}
  .cmdk-input::placeholder{color:var(--ink-4)}
  .cmdk-results{flex:1;overflow:auto;padding:8px 0}
  .cmdk-group{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);padding:10px 18px 4px}
  .cmdk-row{display:flex;align-items:center;gap:12px;padding:8px 18px;cursor:pointer;border-left:2px solid transparent}
  .cmdk-row.sel{background:var(--bg);border-left-color:var(--ink)}
  .cmdk-row:hover{background:var(--bg)}
  .cmdk-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);background:var(--panel);border-radius:5px;flex-shrink:0}
  .cmdk-icon.mono{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
  .cmdk-label{font-size:14px;color:var(--ink);font-weight:500;white-space:nowrap}
  .cmdk-sub{font-size:12.5px;color:var(--ink-3);font-family:var(--serif);font-style:italic;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .cmdk-kind{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);background:var(--panel);padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
  .cmdk-keys{display:flex;gap:3px}
  .cmdk-foot{display:flex;gap:14px;padding:9px 18px;border-top:1px solid var(--line-2);background:rgba(0,0,0,.012);font-family:var(--mono);font-size:10.5px;color:var(--ink-3);align-items:center}
  .cmdk-foot > span{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .cmdk-foot kbd{min-width:18px;height:18px;font-size:10.5px;border-bottom-width:1.5px}

  /* Presets dropdown */
  .presets-pop{max-height:520px}
  .presets-search{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-3);background:var(--bg)}
  .presets-search input{flex:1;background:transparent;border:0;outline:0;font:inherit;font-size:12.5px;color:var(--ink);font-family:var(--mono)}
  .presets-list{overflow:auto;padding:4px 0;max-height:380px}
  .presets-group{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-4);padding:9px 14px 4px}
  .preset-item{display:flex;gap:10px;padding:9px 14px;width:100%;text-align:left;background:none;border:0;cursor:pointer;align-items:flex-start;border-left:2px solid transparent}
  .preset-item:hover{background:var(--bg);border-left-color:var(--ink)}
  .preset-icon{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);border-radius:5px;font-size:14px;color:var(--ink-2);flex-shrink:0}
  .preset-text{flex:1;min-width:0}
  .preset-name{font-size:13.5px;color:var(--ink);font-weight:500}
  .preset-body{font-size:12px;color:var(--ink-3);font-family:var(--serif);font-style:italic;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Skills palette */
  .skills-pal .skill-row{padding:10px 18px;align-items:flex-start}
  .skill-text{flex:1;min-width:0}
  .skill-name{font-family:var(--mono);font-size:13.5px;color:var(--ink);font-weight:500}
  .skill-args{color:var(--ink-4);font-weight:400}
  .skill-desc{font-size:12.5px;color:var(--ink-3);font-family:var(--serif);margin-top:3px;line-height:1.45}

  /* New session modal */
  .slug-input{display:flex;align-items:stretch;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-family:var(--mono);font-size:13px}
  .slug-input:focus-within{border-color:var(--ink-4);box-shadow:0 0 0 3px rgba(40,30,15,.04)}
  .slug-prefix, .slug-suffix{padding:9px 0 9px 12px;color:var(--ink-4);background:var(--bg);user-select:none;display:flex;align-items:center;white-space:nowrap}
  .slug-suffix{padding:9px 12px 9px 0}
  .slug-tail{flex:1;background:transparent;border:0;outline:0;font:inherit;font-size:13.5px;color:var(--ink);padding:9px 4px;min-width:80px}
  .slug-tail::placeholder{color:var(--ink-4);font-style:italic}
  .form-hint{font-size:11.5px;color:var(--ink-4);margin-top:6px;font-family:var(--sans);line-height:1.5}
  .template-grid{display:flex;flex-direction:column;gap:6px}
  .template-card{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg);border:1px solid var(--line);border-radius:7px;cursor:pointer;text-align:left;font-family:var(--sans)}
  .template-card.on{background:var(--canvas);border-color:var(--ink-4);box-shadow:var(--shadow)}
  .template-card:not(.on):hover{border-color:var(--ink-4)}
  .template-icon{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);border-radius:6px;font-family:var(--mono);font-size:16px;color:var(--ink-2);flex-shrink:0}
  .template-card.on .template-icon{background:var(--ink);color:var(--canvas)}
  .template-text{flex:1;min-width:0}
  .template-name{font-size:13.5px;font-weight:600;color:var(--ink)}
  .template-desc{font-size:12px;color:var(--ink-3);font-family:var(--serif);margin-top:2px;line-height:1.45}
  .template-radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-4);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .template-card.on .template-radio{border-color:var(--ink);background:var(--ink)}
  .template-card.on .template-radio span{width:6px;height:6px;border-radius:50%;background:var(--canvas)}
</style>
</head>
